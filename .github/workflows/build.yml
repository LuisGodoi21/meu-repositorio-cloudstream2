name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build Plugins
        run: |
          chmod +x gradlew
          ./gradlew make

      - name: Upload Repositorio Pronto
        uses: actions/upload-artifact@v4
        with:
          name: meu-repositorio-cloudstream
          path: |
            **/build/*.cs3
            **/build/plugins.json
