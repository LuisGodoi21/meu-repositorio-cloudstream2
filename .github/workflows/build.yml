name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          path: "src"

      - name: Checkout builds
        uses: actions/checkout@v3
        continue-on-error: true
        with:
          ref: "builds"
          path: "builds"

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make
          cp -r ExampleProvider/build/*.cs3 ../builds/
          cp ExampleProvider/build/plugins.json ../builds/

      - name: Push Builds
        run: |
          cd builds
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git diff-index --quiet HEAD || git commit -m "Update builds"
          git push origin builds
